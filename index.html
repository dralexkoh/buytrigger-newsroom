<style>
/* One deliberate visual world: a night newsroom. Single theme by design, every colour painted explicitly. */
:root{
  --ground:#04121f; --ground-2:#07182a; --deep:#020a12; --panel:rgba(255,255,255,.05); --panel-2:rgba(255,255,255,.08);
  --line:rgba(190,215,235,.16); --text:#f4f7fa; --soft:#c5d3df; --muted:#9fb3c4;
  --red:#b70000; --red-hi:#ef4444; --gold:#ffd700; --green:#22c55e; --blue:#6cc4ff; --paper:#f4f7fa; --ink:#04121f;
  --display:'Barlow Condensed','Arial Narrow','Helvetica Neue',sans-serif;
  --body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --gutter:clamp(16px,2.4vw,32px);
}
[hidden]{display:none!important}
html,body{height:100%}
@supports (height:100dvh){html{height:100dvh}}
body{margin:0;background:var(--ground);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mono{font-family:var(--mono)}
.app{height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden;
  background:radial-gradient(1100px 620px at 82% -18%,rgba(183,0,0,.28),rgba(183,0,0,0) 62%),radial-gradient(900px 560px at -6% 108%,rgba(28,96,150,.34),rgba(28,96,150,0) 60%),var(--ground)}
.app[data-mode="work"]{background:#03090f}

/* ── top bar ── */
.top{position:relative;z-index:2;display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:10px var(--gutter);border-bottom:1px solid var(--line);background:rgba(2,10,18,.55)}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.brand-mark{width:40px;height:40px;flex:none;display:block;background:#fff;padding:4px;box-sizing:border-box;border-radius:50%;object-fit:contain}
.brand-name{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.06em;white-space:nowrap}
.seg{display:flex;border:1px solid var(--line)}
.seg button{height:40px;min-width:88px;padding:0 16px;border:0;background:transparent;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--ink)}
.seg button:not([aria-pressed="true"]):hover{background:var(--panel-2);color:var(--text)}
.edition{display:flex;align-items:center;gap:8px;min-width:0}
.edition label{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--gold)}
.edition select{height:40px;min-width:0;width:100%;max-width:340px;padding:0 10px;background:var(--deep);border:1px solid var(--line);font-family:var(--mono);font-size:13px}
.fresh{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;min-width:0;font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:8px;height:26px;padding:0 10px;font-size:11px;font-weight:600;letter-spacing:.12em}
.pill i{width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1.6s ease-in-out infinite}
.pill.live{background:var(--red);color:#fff}
.pill.quiet{border:1px solid rgba(255,215,0,.55);color:var(--gold)}
.pill.quiet i{display:none}
.admin-bar{order:9;flex:1 1 100%;display:flex;align-items:center;gap:12px;min-width:0}
.login{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border:1px solid var(--line);background:transparent;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.12em}
.login:hover{background:var(--panel-2)}
.login[data-act="logout"]{color:var(--muted)}
.clock{font-family:var(--mono);font-size:14px;font-weight:600;letter-spacing:.06em;white-space:nowrap}
.clock span{color:var(--muted);font-weight:400;margin-right:6px}

.notebar{position:relative;z-index:2;display:flex;align-items:center;gap:8px;padding:8px var(--gutter);border-bottom:1px solid var(--line);background:rgba(2,10,18,.7)}
.notebar label{flex:none;font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--gold)}
.notebar input{flex:1;min-width:0;height:40px;padding:0 12px;border:1px solid var(--line);background:var(--deep);color:var(--text);font:inherit;font-size:14px}
.notebar input::placeholder{color:var(--muted)}
.notebar button{flex:none;height:40px;padding:0 14px;border:1px solid var(--line);background:var(--panel);font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.1em}
.notebar button:hover{background:rgba(255,255,255,.16)}
.toast{position:relative;z-index:2;display:flex;align-items:center;gap:12px;padding:10px var(--gutter);background:var(--gold);color:var(--ink);font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.06em}
.empty{flex:1;display:grid;place-items:center;padding:48px var(--gutter);text-align:center}
.empty h2{margin:0 0 8px;font-family:var(--display);font-size:34px;letter-spacing:.02em}
.empty p{margin:0;max-width:52ch;color:var(--soft)}

/* ── WATCH: rolling channel ── */
.watch{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;overflow:hidden}
.wedge{position:absolute;right:-160px;top:-330px;width:440px;height:560px;background:var(--red);transform:skewX(-24deg);opacity:.14;pointer-events:none}
.wedge.gold{right:190px;width:22px;background:var(--gold);opacity:.16}
.watch-main{position:relative;flex:1;min-height:0;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,340px);grid-template-rows:minmax(0,1fr);gap:24px;padding:20px var(--gutter)}
.stage{min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:12px}
.stage-story{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.story{flex:1;min-height:0;display:flex;flex-direction:column;gap:18px;animation:fade .55s ease-out both}
.kick{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-family:var(--mono);font-size:12px;letter-spacing:.1em}
.tag{display:inline-flex;align-items:center;height:30px;padding:0 12px;background:var(--gold);color:var(--ink);font-weight:600}
.kick .slot{font-weight:600}
.kick .pos{color:var(--muted)}
.kick .when{display:inline-flex;align-items:center;height:26px;padding:0 8px;border:1px solid rgba(255,215,0,.5);color:var(--gold);font-size:11px}
.conf{margin-left:auto;display:inline-flex;align-items:center;height:28px;padding:0 10px;border:1px solid currentColor;font-size:11px}
.lv-ok{color:var(--green)}.lv-mid{color:var(--gold)}.lv-low{color:#ff9a9a}
.headline{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(34px,5.4vw,74px);line-height:1;letter-spacing:-.005em;text-wrap:balance;overflow-wrap:anywhere}
.dek{margin:0;max-width:74ch;font-size:clamp(16px,1.5vw,21px);line-height:1.55;color:var(--soft);text-wrap:pretty}
.callouts{margin-top:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.callout{min-width:0;padding:12px 16px;background:var(--panel);border-top:3px solid var(--red);display:flex;flex-direction:column;gap:8px;justify-content:space-between}
.callout:last-child{border-top-color:var(--gold)}
.callout b{font-family:var(--display);font-weight:700;font-size:clamp(26px,3.2vw,46px);line-height:1;overflow-wrap:anywhere}
.callout:last-child b{color:var(--gold)}
.callout span{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);line-height:1.3}
.lower{display:flex;align-items:stretch;min-height:34px}
.lower-tab{flex:none;display:flex;align-items:center;padding:0 24px 0 12px;background:var(--red);clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%);font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.08em}
.lower-text{flex:1;min-width:0;margin-left:-8px;padding:6px 12px 6px 20px;display:flex;align-items:center;background:var(--panel-2);font-family:var(--mono);font-size:11px;overflow-wrap:anywhere}
.ctrl{display:flex;align-items:center;gap:10px}
.text-btn svg{display:none}
.rundown-btn{display:none}
.sheet-close{display:none}
.ev-btn{border-color:rgba(255,215,0,.55);color:var(--gold)}
.icon-btn{width:36px;height:36px;flex:none;display:grid;place-items:center;padding:0;border:1px solid var(--line);background:var(--panel)}
.text-btn{height:36px;min-width:88px;padding:0 12px;border:1px solid var(--line);background:var(--panel);font-family:var(--mono);font-size:11px;letter-spacing:.1em}
.icon-btn:hover,.text-btn:hover{background:rgba(255,255,255,.16)}
.prog{flex:1;height:4px;background:rgba(255,255,255,.12);overflow:hidden}
.prog i{display:block;height:4px;background:var(--gold);animation:fill linear both}
.held .prog i,.held .track{animation-play-state:paused}
.next-in{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--muted);white-space:nowrap}

.rail{min-width:0;min-height:0;display:flex;flex-direction:column;gap:12px}
.rundown-wrap{flex:1 1 auto;min-height:150px;overflow:auto;scrollbar-width:thin}
.rail-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.rail h2,.coming h2{margin:0;font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.1em}
.rail-head span{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--muted)}
.rundown{display:flex;flex-direction:column;animation:roll .5s ease-out both}
.run{width:100%;min-height:68px;padding:8px 10px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;display:grid;grid-template-columns:50px minmax(0,1fr);gap:10px;align-items:center}
.run:hover{background:rgba(255,255,255,.07)}
.run.now{background:rgba(183,0,0,.36)}
.run .slotno{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.06em;color:var(--muted)}
.run.now .slotno{color:#fff}.run.next .slotno{color:var(--gold)}
.run .meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--muted)}
.run .meta b{color:var(--gold);font-weight:500}
.run .short{font-size:15px;line-height:1.28;font-weight:500}
.coming{flex:0 1 auto;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:6px;padding-top:12px}
@media (max-height:820px){.coming .cat:nth-child(n+5){display:none}}
@media (max-height:700px){.coming .cat:nth-child(n+4){display:none}}
.cat{display:grid;grid-template-columns:132px minmax(0,1fr);gap:12px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line)}
.cat b{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--gold)}
.cat span{font-size:14px;line-height:1.3;color:#e3ebf2}

.tickers{flex:none;position:relative;z-index:2;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--deep)}
.band{display:flex;align-items:stretch;overflow:hidden}
.band.crawl{height:42px;background:var(--paper);color:var(--ink)}
.band.mkts{height:44px;background:var(--deep);border-top:1px solid var(--line)}
.band-tab{flex:none;position:relative;z-index:1;display:flex;align-items:center}
.crawl .band-tab{padding:0 28px 0 var(--gutter);background:var(--red);color:#fff;clip-path:polygon(0 0,100% 0,calc(100% - 16px) 100%,0 100%);font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.1em}
.mkts .band-tab{padding:0 16px 0 var(--gutter);background:var(--deep);border-right:1px solid var(--line);font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--gold)}
.band-view{flex:1;min-width:0;overflow:hidden;display:flex;align-items:center}
.track{display:flex;align-items:center;width:max-content;white-space:nowrap;animation:slide linear infinite}
.crawl-item{display:flex;align-items:center;gap:16px;padding-left:16px;font-size:15px;font-weight:600}
.crawl-item i{width:8px;height:8px;background:var(--red);transform:rotate(45deg)}
.mkt{display:flex;align-items:baseline;gap:8px;padding:0 18px;border-right:1px solid var(--line);font-family:var(--mono);font-size:14px}
.mkt small{font-size:11px;letter-spacing:.08em;color:var(--muted)}
.up{color:var(--green)}.dn{color:var(--red-hi)}.nt{color:var(--gold)}

/* ── WORK: content terminal ── */
.work{flex:1;display:flex;flex-direction:column;min-height:0;font-size:14px}
.strip{flex:none;display:flex;align-items:center;gap:0;overflow-x:auto;padding:8px var(--gutter);background:#050e17;border-bottom:1px solid #15293a;white-space:nowrap;scrollbar-width:none}
.strip .mkt{padding:0 16px 0 0;margin-right:16px;border-right:1px solid #15293a;font-size:13px}
.steps{display:none}
.cols{flex:1;display:grid;grid-template-columns:minmax(280px,.9fr) minmax(0,1.45fr) minmax(300px,.95fr);gap:1px;background:#15293a;min-height:0}
.col{min-width:0;min-height:0;overflow:auto;display:flex;flex-direction:column;background:#07121c}
.col.mid{background:#050e17}
.col-head{position:sticky;top:0;z-index:1;flex:none;display:flex;align-items:center;gap:10px;min-height:44px;padding:0 16px;border-bottom:1px solid #15293a;background:#07121c}
.col-head i{width:22px;height:22px;flex:none;display:grid;place-items:center;background:var(--gold);color:#03090f;font-family:var(--mono);font-style:normal;font-weight:600;font-size:13px}
.col-head b{font-family:var(--mono);font-size:13px;letter-spacing:.14em}
.col-head span{color:#8fa5b8;font-size:13px}
.wire{width:100%;padding:12px 16px;border:0;border-bottom:1px solid #15293a;background:transparent;text-align:left;display:grid;grid-template-columns:16px minmax(0,1fr);gap:8px}
.wire:hover{background:rgba(255,255,255,.05)}
.wire.on{background:rgba(255,215,0,.1)}
.wire .caret{font-family:var(--mono);font-weight:600;color:var(--gold)}
.wire .meta{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:#8fa5b8}
.wire .meta b{color:var(--text)}.wire.on .meta b{color:var(--gold)}
.wire .state{margin-left:auto;display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.wire h3{margin:6px 0;font-size:15px;line-height:1.33;font-weight:500}
.wire small{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:#8fa5b8}
.evidence{padding:24px clamp(16px,2vw,28px);display:flex;flex-direction:column;gap:14px;animation:rise .28s ease-out both}
.evidence h1{margin:0;font-size:clamp(22px,2.2vw,30px);line-height:1.2;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.evidence .dek{font-size:15px;color:#b9c7d4}
.claims{display:flex;flex-direction:column;margin-top:4px}
.claim-head,.claim{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr) minmax(0,1.3fr) 112px;gap:12px}
.claim-head{padding-bottom:8px;border-bottom:1px solid #1d3a52;font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:#8fa5b8}
.claim{align-items:center;min-height:54px;padding:8px 0;border-bottom:1px solid #15293a}
.claim .what{line-height:1.35}
.claim .val{font-family:var(--mono)}
.claim .val b{display:block;font-size:15px;color:#fff;overflow-wrap:anywhere}
.claim .val small{font-size:11px;letter-spacing:.04em;color:#8fa5b8}
.claim .src{font-family:var(--mono);font-size:12px;line-height:1.4;color:var(--blue);overflow-wrap:break-word}
.claim .st{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em;line-height:1.35}
.st-ok{color:var(--green)}.st-sec{color:var(--blue)}.st-warn{color:var(--gold)}.st-disc{color:#ff9a9a}
.lock{display:flex;gap:14px;align-items:flex-start;margin-top:8px;padding:14px 16px;background:#07121c;border:1px solid #1d3a52}
.lock svg{flex:none;margin-top:2px}
.lock b{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.04em}
.lock span{font-size:13px;line-height:1.4;color:#8fa5b8}
.cards{padding:12px;display:flex;flex-direction:column;gap:10px}
.card{padding:14px;background:#03090f;border:1px solid #1d3a52;display:flex;flex-direction:column;gap:10px}
.card-top{display:flex;align-items:baseline;gap:10px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:#8fa5b8}
.card-top b{font-size:15px;color:var(--gold)}
.card-top time{margin-left:auto;font-size:17px;font-weight:600;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.t-calm{color:var(--text)}.t-soon{color:var(--gold)}.t-now{color:var(--red-hi)}
.card h3{margin:0;font-size:16px;line-height:1.3;font-weight:600;color:#fff}
.card.gone h3{color:#8fa5b8}
.card p{margin:0;font-size:13px;line-height:1.4;color:#b9c7d4}
.card-meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:#8fa5b8}
.bar{height:4px;background:#15293a;overflow:hidden}
.bar i{display:block;height:4px}
.b-calm{background:var(--green)}.b-soon{background:var(--gold)}.b-now{background:var(--red-hi)}
.card-actions{display:grid;grid-template-columns:minmax(0,1fr) 116px;gap:8px}
.approve{height:44px;border:0;background:var(--red);color:#fff;font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.12em}
.approve:hover{background:#d40f0f}
.ghost{height:44px;padding:0 12px;border:1px solid #1d3a52;background:transparent;font-family:var(--mono);font-size:12px;letter-spacing:.06em}
.ghost:hover{background:rgba(255,255,255,.08)}
.done{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid rgba(34,197,94,.6);color:var(--green);font-family:var(--mono);font-size:12px;letter-spacing:.04em}
.gone-note{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:#8fa5b8}
.cards-foot{margin-top:auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:4px 2px 0}
.cards-foot p{max-width:30ch;color:#8fa5b8}
.quiet{padding:20px 16px;color:#8fa5b8}
.statusbar{flex:none;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 24px;padding:10px var(--gutter);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));background:#07121c;border-top:1px solid #15293a;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:#8fa5b8}

/* ── OS: what needs you (owner only) ── */
.os{flex:1;min-height:0;overflow:auto;position:relative;display:flex;flex-direction:column;gap:16px;padding:20px var(--gutter) calc(24px + env(safe-area-inset-bottom,0px))}
.os-top{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(280px,1fr);gap:16px;align-items:stretch}
.next{min-width:0;padding-bottom:20px;background:var(--panel);border-left:6px solid var(--red);display:flex;flex-direction:column;gap:14px;animation:rise .4s ease-out both}
.next-tab{align-self:flex-start;display:flex;align-items:center;height:36px;padding:0 34px 0 16px;background:var(--red);clip-path:polygon(0 0,100% 0,calc(100% - 20px) 100%,0 100%);font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.1em}
.next h1{margin:0;padding:0 20px;font-family:var(--display);font-weight:700;font-size:clamp(30px,4vw,56px);line-height:1.02;text-wrap:balance}
.next p{margin:0;padding:0 20px;max-width:72ch;font-size:clamp(15px,1.2vw,18px);line-height:1.45;color:var(--soft);text-wrap:pretty}
.next-meta{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px;font-family:var(--mono);font-size:12px;letter-spacing:.1em}
.chip{display:inline-flex;align-items:center;height:28px;padding:0 10px;border:1px solid var(--line);color:var(--soft);white-space:nowrap}
.chip.you{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:600}
.chip.due{border-color:var(--red-hi);color:#ffb4b4}
.next-actions{display:flex;flex-wrap:wrap;gap:10px;padding:0 20px;margin-top:auto}
.btn-done{height:48px;padding:0 22px;border:0;background:var(--red);color:#fff;font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.12em}
.btn-done:hover{background:#d40f0f}
.btn-later{min-height:48px;padding:6px 18px;line-height:1.3;border:1px solid var(--line);background:transparent;font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--soft)}
.btn-later:hover{background:var(--panel-2)}
.tiles{display:grid;grid-template-rows:repeat(3,minmax(0,1fr));gap:12px;min-width:0}
.tile{min-width:0;padding:12px 16px;background:var(--panel);border-top:3px solid var(--red);display:flex;align-items:center;justify-content:space-between;gap:12px}
.tile:last-child{border-top-color:var(--gold)}
.tile b{font-family:var(--display);font-weight:700;font-size:clamp(34px,3.6vw,54px);line-height:1;white-space:nowrap}
.tile:last-child b{color:var(--gold)}
.tile span{max-width:18ch;font-family:var(--mono);font-size:11px;letter-spacing:.1em;line-height:1.4;text-transform:uppercase;text-align:right;color:var(--muted)}
.lanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.lane,.panel{min-width:0;background:var(--panel);display:flex;flex-direction:column}
.lane-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:12px 14px 10px}
.lane-head h2{margin:0;font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.08em}
.lane-head span{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--muted);white-space:nowrap}
.lane-bar{height:3px;background:rgba(255,255,255,.12)}
.lane-bar i{display:block;height:3px;background:var(--green)}
.item{display:grid;grid-template-columns:44px minmax(0,1fr);align-items:start;padding:4px 12px 8px 2px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item.isnext{background:rgba(183,0,0,.26)}
.tick{width:44px;height:44px;display:grid;place-items:center;padding:0;border:0;background:transparent}
.tick i{width:22px;height:22px;display:grid;place-items:center;border:2px solid var(--muted);color:transparent}
.tick:hover i{border-color:var(--gold)}
.tick[disabled]{cursor:default}
.item.ticked .tick i{background:var(--green);border-color:var(--green);color:var(--ink)}
.item-text{padding-top:11px;font-size:14.5px;line-height:1.35}
.item.ticked .item-text{color:var(--muted);text-decoration:line-through}
.item-meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--muted)}
.item-meta .who-you{color:var(--gold);font-weight:600}
.os-bottom{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.35fr) minmax(0,.85fr);gap:16px;align-items:start}
.dec{padding:12px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.dec b{font-size:15px;line-height:1.3;font-weight:600}
.dec span{font-size:13px;line-height:1.4;color:var(--soft)}
.dec small,.panel-note{font-family:var(--mono);font-size:11px;letter-spacing:.06em;line-height:1.5;color:var(--muted)}
.panel-note{padding:10px 14px;border-top:1px solid var(--line)}
.mach{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.lamp{width:9px;height:9px;border-radius:50%;background:#5b6f80}
.lamp.ok{background:var(--green)}.lamp.fail{background:var(--red-hi)}.lamp.hold{background:var(--gold)}
.mach b{display:block;font-size:14px;line-height:1.3;font-weight:500}
.mach small{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.04em;line-height:1.4;color:var(--muted)}
.mach time{font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-align:right;white-space:nowrap;color:var(--soft)}
.mach time.fail{color:#ffb4b4}
.num{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:9px 14px;border-top:1px solid var(--line)}
.num span{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num b{font-family:var(--display);font-weight:700;font-size:26px;line-height:1;white-space:nowrap}
.num em{margin-left:8px;font-style:normal;font-family:var(--mono);font-size:11px;font-weight:400;color:var(--green)}
.os-foot{font-family:var(--mono);font-size:11px;letter-spacing:.06em;line-height:1.6;color:var(--muted)}

/* ── fit-to-screen: the page steps these down until the story fits its box ── */
.app[data-fit="1"] .headline{font-size:clamp(30px,4.6vw,60px)}
.app[data-fit="1"] .callout b{font-size:clamp(22px,2.7vw,38px)}
.app[data-fit="2"] .headline{font-size:clamp(28px,4vw,52px)}
.app[data-fit="2"] .dek{display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden;font-size:clamp(15px,1.3vw,18px)}
.app[data-fit="2"] .callout{padding:8px 12px;gap:4px}
.app[data-fit="2"] .callout b{font-size:clamp(20px,2.3vw,32px)}
.app[data-fit="2"] .stage,.app[data-fit="3"] .stage,.app[data-fit="4"] .stage{gap:12px}
.app[data-fit="3"] .headline{font-size:clamp(26px,3.4vw,44px);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.app[data-fit="3"] .dek{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;font-size:clamp(14px,1.2vw,16px)}
.app[data-fit="3"] .callout{padding:6px 10px;gap:2px}
.app[data-fit="3"] .callout b{font-size:clamp(18px,2vw,26px)}
.app[data-fit="4"] .headline{font-size:clamp(22px,2.8vw,36px);-webkit-line-clamp:2}
.app[data-fit="4"] .lower{display:none}
.app[data-fit="4"] .dek{display:none}
.app[data-fit="4"] .callout span{display:none}

.pub{display:flex;align-items:center;gap:10px;margin-left:auto}
.pub a{display:inline-flex;align-items:center;height:36px;padding:0 14px;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.12em;text-decoration:none;white-space:nowrap}
.pub .letter,.pub .signin{border:1px solid var(--line);color:var(--soft)}
.pub .letter:hover,.pub .signin:hover{background:var(--panel-2);color:var(--text)}
.pub .signin{color:var(--text)}
.pub .join{background:var(--gold);color:var(--ink)}
.pub .join:hover{background:#ffe66b}
.ribbon,.legal{position:relative;z-index:2;display:flex;align-items:center;gap:10px;white-space:nowrap;overflow:hidden;font-family:var(--mono);letter-spacing:.06em}
.ribbon span,.legal span{overflow:hidden;text-overflow:ellipsis}
.ribbon{padding:6px var(--gutter);background:rgba(255,215,0,.1);border-bottom:1px solid rgba(255,215,0,.3);font-size:11px;color:var(--soft)}
.ribbon b{flex:none;color:var(--gold);font-weight:600}
.legal{padding:7px var(--gutter);padding-bottom:calc(7px + env(safe-area-inset-bottom,0px));background:#020a12;border-top:1px solid var(--line);font-size:10px;color:var(--muted)}
.legal b{flex:none;color:var(--soft);font-weight:500}
.ribbon .narrow,.legal .narrow{display:none}
@media (max-width:620px){
  .pub{gap:6px;flex:1 1 100%;order:4}
  .pub a{height:30px;padding:0 9px;font-size:10px;letter-spacing:.06em}
  .ribbon .wide,.legal .wide{display:none}
  .ribbon .narrow,.legal .narrow{display:inline}
  .ribbon{padding:5px 16px;font-size:10px;gap:8px}
  .legal{padding:5px 16px;font-size:9px;gap:8px}
}

        '<div class="about-legal"><p class="disc"><b>Education, not advice. I hold positions in some of the stocks I write about.</b></p>' +
        "<p>Capital at risk. Every number carries its source.</p><p>Pictures are AI illustrations.</p><p>© BuyTrigger · Dr Alex Koh</p></div>" +
        '<div class="acts"><a class="rd" href="#join" data-join>JOIN FREE</a></div></div></article>';
    }
    if (f.kind === "join") {
      return '<article class="slide join gold"' + at + ' data-nopen="1"><div class="body">' + kick("CLUB", n, '<span class="when">Join</span>') +
        '<h1 class="headline">The market, through the day. The letter, every week.</h1>' +
        '<p class="dek">Free. Written for family investors. Every number carries its source. Members open the evidence behind every story.</p>' +
        LETTER_FORM + "<small>Free. Unsubscribe in one tap.</small>" +
        '<div class="club-actions"><a class="btn-done" href="/join/">SEE THE CLUB</a><a class="btn-later" href="https://dashboard.buytrigger.club" target="_blank" rel="noopener">LOG IN</a></div></div></article>';
    }
    /* nothing fresh to show: a still frame and an honest line; About and Join stay one move away */
    return '<article class="slide text status"' + at + ' data-nopen="1"><div class="body">' + kick("NEWSROOM", n, "") +
      (answered ? '<h1 class="headline">No fresh edition right now</h1><p class="dek">Older editions are not shown as if they were today’s news. Fresh editions appear here automatically.</p>'
                : '<h1 class="headline">Connecting to the feed</h1><p class="dek">Editions appear here as soon as the newsroom files one.</p>') +
      '<div class="acts"><a class="rd" href="#join" data-join>JOIN FREE</a></div></div></article>';
  }

  /* ───────── header: the pill, the filed time, the What moved ticker ───────── */
  function renderFresh() {
    var e = editions[0], pill = $("pill"), text = $("fresh-text");
    if (preview && e) {
      pill.className = "pill quiet"; $("pill-text").textContent = "PREVIEW";
      text.textContent = "SAMPLE EDITIONS · " + dayMonth(Date.parse(e.as_of)) + " " + london(Date.parse(e.as_of), { year: "numeric" }); return;
    }
    if (!fresh()) { pill.className = "pill quiet"; $("pill-text").textContent = "FEED QUIET"; text.textContent = ""; return; }
    var filed = Date.parse(e.as_of), checked = Date.parse(e.checked_at || ""), latest = Math.max(filed || 0, checked || 0);
    var live = latest && Date.now() - latest < 6 * 3600 * 1000;   /* five editions a weekday leave gaps of up to five hours */
    pill.className = "pill " + (live ? "live" : "quiet");
    $("pill-text").textContent = live ? "ROLLING" : "FEED QUIET";
    text.innerHTML = '<span class="wide">FILED ' + esc(london(filed, { weekday: "short" }).toUpperCase() + " " + dayMonth(filed)) + " · </span>" + esc(london(filed, HM)) +
      (checked && checked > filed ? '<span class="wide"> · CHECKED ' + esc(london(checked, HM)) + "</span>" : "");
  }
  function renderMoved() {
    var eds = dayEditions(), m = null, from = null;
    for (var k = 0; k < eds.length && !m; k++) if (Array.isArray(eds[k].markets) && eds[k].markets.length) { m = eds[k].markets; from = eds[k]; }
    $("moved").hidden = !m;
    if (!m) { $("moved-track").innerHTML = ""; return; }
    $("moved-date").textContent = dayMonth(Date.parse(from.as_of));
    var one = m.map(function (x) {
      return '<div class="mkt"><small>' + esc(x.sym) + "</small><span>" + esc(x.val) + '</span><b class="' + (x.dir === "up" ? "up" : x.dir === "dn" ? "dn" : "nt") + '">' + esc(x.chg) + "</b></div>";
    }).join("");
    $("moved-track").innerHTML = one + one;
    $("moved-track").style.animationDuration = Math.max(24, m.length * 6) + "s";
  }
  function tickLabels() {
    var els = document.querySelectorAll("[data-t]");
    for (var k = 0; k < els.length; k++) { var v = agoLabel(Number(els[k].getAttribute("data-t"))); if (els[k].textContent !== v) els[k].textContent = v; }
    renderFresh();
    try { $("clock").textContent = london(Date.now(), { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false }); } catch (e) {}
  }

  /* ───────── the frame ───────── */
  function dims() {
    var w = viewport.clientWidth, phone = w <= 820, peek = phone ? 40 : 96, gap = phone ? 10 : 18;
    return { peek: peek, gap: gap, card: Math.max(240, w - peek * 2 - gap) };
  }
  /* measured from the cards themselves, so borders and rounding can never add up across a long deck */
  function tx(extra) { var s = slides[i]; return dims().peek - (s ? s.offsetLeft - slides[0].offsetLeft : 0) + (extra || 0); }
  /* the summary takes the room the card has, and ends on a whole line */
  function fitDeks() {
    for (var k = Math.max(0, i - 1); k <= Math.min(N - 1, i + 2); k++) {
      var pic = slides[k].querySelector(".pic");
      if (pic && !pic.style.backgroundImage) pic.style.backgroundImage = "url(" + picUrl(pic.getAttribute("data-pic")) + ")";      /* loaded only when the card is near */
      if (k > i + 1) continue;
      if (pic) { pic.style.display = ""; if (pic.offsetHeight < 56) pic.style.display = "none"; }      /* no sliver of a photo on a very short screen */
      var d = slides[k].querySelector(".dek.fit"), inner = d && d.firstElementChild; if (!inner) continue;
      var lh = parseFloat(getComputedStyle(d).lineHeight) || 22;
      inner.style.webkitLineClamp = String(Math.max(2, Math.floor((d.clientHeight + 1) / lh)));
    }
  }
  function paint(animate, extra) {
    if (!N) return;
    var d = dims();
    slides.forEach(function (s, k) {
      s.style.width = d.card + "px"; s.style.marginRight = d.gap + "px";
      var on = k === i;
      s.classList.toggle("on", on);
      s.setAttribute("aria-hidden", on && !qrOpen ? "false" : "true");
      var f = s.querySelectorAll("a,button,input");
      for (var q = 0; q < f.length; q++) { if (on && !qrOpen) f[q].removeAttribute("tabindex"); else f[q].setAttribute("tabindex", "-1"); }
    });
    track.classList.toggle("snap", !!animate && !reduced && extra == null);
    track.style.transform = "translate3d(" + tx(extra) + "px,0,0)";
    dots.forEach(function (b, k) {
      if (k === i) b.setAttribute("aria-current", "true"); else b.removeAttribute("aria-current");
      b.classList.toggle("seen", k < i);
    });
    countEl.innerHTML = (i + 1) + " <em>/</em> " + N;
    prevBtn.disabled = i === 0; nextBtn.disabled = i === N - 1;
    if (extra == null) fitDeks();
  }
  function announce() {
    var h = slides[i] && slides[i].querySelector(".headline");
    liveEl.textContent = "Story " + (i + 1) + " of " + N + (h ? ": " + h.textContent : "");
  }
  var hintTimer = setTimeout(dismissHint, 4000);
  function dismissHint() {
    if (hinted) return;
    hinted = true; clearTimeout(hintTimer);
    frame.classList.remove("cue"); hint.classList.add("gone");
    setTimeout(function () { hint.hidden = true; }, reduced ? 0 : 450);
  }
  function show(n, fromUser) {
    n = Math.max(0, Math.min(N - 1, n));
    if (qrOpen) closeQR(true);
    if (fromUser) dismissHint();
    if (n === i) { paint(true); return; }
    i = n; paint(true); announce();
    if (dots[i] && dots[i].scrollIntoView) dots[i].scrollIntoView({ block: "nearest", inline: "nearest" });
  }
  function indexOfId(id) { for (var k = 0; k < items.length; k++) if (items[k].id === id) return k; return -1; }
  function indexOfKey(key) { for (var k = 0; key && k < items.length; k++) if ((items[k].key || items[k].id) === key) return k; return -1; }
  function render() {
    var was = items[i] || null, keep = i > 0 && was ? was.id : null;      /* on the lead card you stay on the lead; anywhere else you keep your story */
    items = buildItems(); N = items.length;
    track.innerHTML = items.map(slideHtml).join("");
    slides = [].slice.call(track.querySelectorAll(".slide"));
    $("dots").innerHTML = items.map(function (f, n) { return '<button type="button" data-go-to="' + n + '" aria-label="Story ' + (n + 1) + " of " + N + '"></button>'; }).join("");
    dots = [].slice.call($("dots").querySelectorAll("button"));
    var k = keep ? indexOfId(keep) : -1;
    if (keep && k < 0) k = indexOfKey(was.key || was.id);      /* the same story, filed again in a newer edition */
    i = k >= 0 ? k : keep ? Math.min(i, N - 1) : 0;
    if (qrOpen && indexOfId(qrId) < 0) closeQR(true);
    renderMoved(); renderFresh(); paint(false);
    if (!was || !items[i] || items[i].id !== was.id) announce();
  }

  /* wheel: one gesture, one story. The cooldown stops trackpad inertia skipping ahead. */
  var wheelLock = false, wheelAcc = 0, wheelT = 0;
  frame.addEventListener("wheel", function (ev) {
    if (qrOpen) return;                       /* let the quick read scroll */
    ev.preventDefault();
    var now = Date.now();
    if (now - wheelT > 280) wheelAcc = 0;
    wheelT = now;
    if (wheelLock) return;
    wheelAcc += ev.deltaY || ev.deltaX;
    if (Math.abs(wheelAcc) < 70) return;
    var dir = wheelAcc > 0 ? 1 : -1; wheelAcc = 0;
    if ((dir < 0 && i === 0) || (dir > 0 && i === N - 1)) return;
    wheelLock = true; show(i + dir, true);
    setTimeout(function () { wheelLock = false; wheelAcc = 0; }, 620);
  }, { passive: false });

  /* swipe or drag */
  var drag = null;
  viewport.addEventListener("pointerdown", function (ev) {
    if (qrOpen || ev.target.closest("a,button,input,form,textarea,select")) return;
    if (ev.button && ev.button !== 0) return;
    drag = { x: ev.clientX, y: ev.clientY, dx: 0, axis: null };
  });
  viewport.addEventListener("pointermove", function (ev) {
    if (!drag) return;
    var dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
    if (!drag.axis) {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      drag.axis = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
      /* capture only once it is a sideways drag, so a plain tap or click still lands on the card */
      if (drag.axis === "x") { track.classList.remove("snap"); try { viewport.setPointerCapture(ev.pointerId); } catch (err) {} }
    }
    if (drag.axis !== "x") return;
    ev.preventDefault(); drag.dx = dx;
    if ((i === 0 && dx > 0) || (i === N - 1 && dx < 0)) dx *= 0.32;      /* rubber band at the ends */
    paint(false, dx);
  });
  function endDrag() {
    if (!drag) return;
    var dx = drag.dx, axis = drag.axis, moved = axis != null; drag = null;
    if (axis === "x" && Math.abs(dx) > 48) { justDragged = Date.now(); show(i + (dx < 0 ? 1 : -1), true); }
    else { if (moved) justDragged = Date.now(); paint(true); }
  }
  var justDragged = 0;
  viewport.addEventListener("pointerup", endDrag);
  viewport.addEventListener("pointercancel", endDrag);

  document.addEventListener("keydown", function (ev) {
    var tag = (ev.target && ev.target.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA" || ev.altKey || ev.ctrlKey || ev.metaKey) return;
    if (qrOpen) { if (ev.key === "Escape") { ev.preventDefault(); backQR(); } return; }
    if (ev.key === "ArrowRight" || ev.key === "ArrowDown" || ev.key === "PageDown") { ev.preventDefault(); show(i + 1, true); }
    else if (ev.key === "ArrowLeft" || ev.key === "ArrowUp" || ev.key === "PageUp") { ev.preventDefault(); show(i - 1, true); }
    else if (ev.key === "Home") { ev.preventDefault(); show(0, true); }
    else if (ev.key === "End") { ev.preventDefault(); show(N - 1, true); }
    else if (ev.key === "Enter" && tag !== "BUTTON" && tag !== "A") {
      var s = slides[i];
      if (s && !s.hasAttribute("data-nopen")) { ev.preventDefault(); openQR(s.dataset.id); }     /* without this the same key press would press BACK */
    }
  });

  document.addEventListener("click", function (ev) {
    var t = ev.target;
    var go = t.closest("[data-go]");
    if (go) { ev.preventDefault(); show(i + parseInt(go.getAttribute("data-go"), 10), true); return; }
    var to = t.closest("[data-go-to]");
    if (to) { ev.preventDefault(); show(parseInt(to.getAttribute("data-go-to"), 10), true); return; }
    if (t.closest("[data-join]")) { ev.preventDefault(); show(N - 1, true); return; }
    if (t.closest("[data-about]")) { ev.preventDefault(); show(N - 2, true); return; }
    var q = t.closest("[data-q]");
    if (q) { if (q.getAttribute("data-q") === "back") backQR(); else share(items[indexOfId(qrId)], q); return; }
    var act = t.closest("[data-a]"), card = t.closest(".slide");
    if (act && card) {
      ev.preventDefault();
      if (act.getAttribute("data-a") === "share") share(items[indexOfId(card.dataset.id)], act); else openQR(card.dataset.id);
      return;
    }
    if (!card || Date.now() - justDragged < 350) return;
    var k = parseInt(card.dataset.i, 10);
    if (k !== i) { ev.preventDefault(); show(k, true); return; }                       /* the peek of a neighbour goes there */
    if (!t.closest("a,input,button,form") && !card.hasAttribute("data-nopen")) openQR(card.dataset.id);   /* the story opens its quick read */
  });

  /* ───────── the quick read, inside the same frame ───────── */
  function openQR(id) {
    var k = indexOfId(id), f = items[k];
    if (!f || f.kind !== "story") return;
    if (k !== i) { i = k; paint(false); }
    dismissHint();
    $("qr-body").innerHTML = (f.pic ? '<div class="qr-pic" style="background-image:url(' + picUrl(f.pic) + ')"></div>' : "") +
      '<div class="qr-col"><div class="kick"><span class="tag">' + esc(f.tag) + "</span>" + whenChip(f.t) + (f.conf ? '<span class="conf lv-' + f.level + '">' + esc(f.conf) + "</span>" : "") + "</div>" +
      '<h1 class="headline">' + esc(f.head) + "</h1>" +
      '<p class="by"><b>' + esc(f.desk) + '</b> · <span data-t="' + f.t + '">' + esc(agoLabel(f.t)) + "</span></p>" +
      '<div class="read">' +
      (!f.read.take ? "" : f.read.filed ? '<div class="take"><h3>THE QUICK TAKE</h3><p>' + esc(f.read.take) + "</p></div>"
                                        : '<p class="lead">' + esc(f.read.take) + "</p>") +     /* only a take the newsroom wrote is called one */
      callouts(f.co) +
      f.read.sections.map(function (sec) {
        return (sec.h ? "<h2>" + esc(sec.h) + "</h2>" : "") + sec.p.map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("");
      }).join("") +
      (f.read.holders ? '<div class="hold"><h3>FOR LONG-TERM HOLDERS</h3><p>' + esc(f.read.holders) + "</p></div>" : "") +
      (f.read.watch ? '<div class="watch"><h3>WHAT TO WATCH</h3><p>' + esc(f.read.watch) + "</p></div>" : "") +
      "</div>" + sources(f.src) +
      '<div class="club"><b>CLUB</b><p>Members open the evidence behind every story.</p><a href="/join/">SEE THE CLUB</a></div></div>';
    $("qr-body").scrollTop = 0;
    lastFocus = document.activeElement;
    $("qr").classList.add("open"); document.body.classList.add("qr-on");
    qrOpen = true; qrId = id; paint(false);
    var back = $("qr").querySelector(".back"); if (back) back.focus();
    try { if (!(history.state && history.state.qr === id)) history.pushState({ qr: id }, "", "#read-" + id); } catch (e) {}
  }
  function closeQR(silent) {
    if (!qrOpen) return;
    $("qr").classList.remove("open"); document.body.classList.remove("qr-on");
    qrOpen = false; qrId = null; paint(false);
    if (lastFocus && lastFocus.focus && document.contains(lastFocus)) lastFocus.focus();
    lastFocus = null;
    try { if (!silent && history.state && history.state.qr) history.back(); } catch (e) {}
  }
  function backQR() {
    var viaHistory = false;
    try { viaHistory = !!(history.state && history.state.qr); if (viaHistory) history.back(); } catch (e) { viaHistory = false; }
    if (viaHistory) setTimeout(function () { if (qrOpen) closeQR(true); }, 250);     /* in case the browser sends no popstate */
    if (!viaHistory) { closeQR(true); try { if (location.hash.indexOf("#read-") === 0) history.replaceState({}, "", location.pathname + location.search); } catch (e) {} }
  }
  window.addEventListener("popstate", function () { if (qrOpen) closeQR(true); });
  function share(f, btn) {
    var u = location.href.split("#")[0] + (f && f.kind === "story" ? "#read-" + f.id : "");
    if (navigator.share) { navigator.share({ title: f && f.head, url: u }).catch(function () {}); return; }
    if (!navigator.clipboard) return;
    navigator.clipboard.writeText(u).then(function () {
      var label = btn && (btn.querySelector("span") || btn); if (!label) return;
      var was = label.textContent; label.textContent = "LINK COPIED";
      setTimeout(function () { label.textContent = was; }, 1600);
    }).catch(function () {});
  }

  /* ───────── the feed ─────────
     Once a minute the page asks which editions exist (a few hundred bytes each) and downloads a full
     edition only when it is new or has been re-stamped. Nothing is asked while the tab is hidden. */
  function usable(e) { return e && Array.isArray(e.stories) && e.stories.length && e.stories[0].headline; }
  function setEditions(list) {
    editions = list.filter(usable).sort(function (a, b) { return String(b.as_of || "").localeCompare(String(a.as_of || "")); });
    window.BT_EDITION_ID = editions[0] && fresh() ? editions[0]._id : null;      /* CRM: the edition on screen */
    render();
  }
  function toDocs(rows) { return rows.map(function (r) { return Object.assign({}, r.doc, { _id: r.edition_id, checked_at: r.checked_at }); }); }
  var BASE = FEED.url.replace(/\/+$/, "") + "/rest/v1/" + FEED.table;
  var INDEX = BASE + "?select=edition_id,as_of,checked_at&withdrawn=eq.false&order=as_of.desc&limit=" + FEED.newest;
  var FULL = BASE + "?select=edition_id,as_of,as_of_label,title,origin,doc,checked_at&withdrawn=eq.false&edition_id=in.";
  var have = {}, shown = "", busy = false, wait = CHECK_EVERY, timer = null, last = 0, wasFresh = false;
  function sigOf(list) { return list.map(function (r) { return r.edition_id + "|" + r.as_of + "|" + (r.checked_at || ""); }).join(","); }
  async function getRows(url) {
    var res = await fetch(url, { headers: { apikey: FEED.key, Authorization: "Bearer " + FEED.key }, cache: "no-store" });
    if (!res.ok) throw new Error("feed " + res.status);
    var rows = await res.json();
    if (!Array.isArray(rows)) throw new Error("feed shape");
    return rows;
  }
  async function pullFeed() {
    if (busy) return;
    busy = true; last = Date.now();
    try {
      var index = await getRows(INDEX);
      var missing = index.filter(function (r) {
        var h = have[r.edition_id];
        return /^[A-Za-z0-9_.-]+$/.test(String(r.edition_id)) && (!h || h.as_of !== r.as_of || (h.checked_at || "") !== (r.checked_at || ""));
      }).map(function (r) { return r.edition_id; });
      if (missing.length) (await getRows(FULL + "(" + missing.join(",") + ")")).forEach(function (r) { have[r.edition_id] = r; });
      var list = [], keep = {};
      index.forEach(function (r) { var h = have[r.edition_id]; if (h) { keep[r.edition_id] = h; list.push(h); } });
      have = keep;                                  /* a withdrawn edition, or one past the newest 24, drops out here */
      var sig = sigOf(list);
      if (sig !== shown) {
        shown = sig; setEditions(toDocs(list));
        try { var body = JSON.stringify(list); if (body.length < 1500000) sessionStorage.setItem(CACHE_KEY, body); } catch (e) {}
      }
      wait = CHECK_EVERY;
    } catch (e) {
      wait = Math.min(wait * 2, CHECK_SLOWEST);     /* what is on screen stays; ask less often while the feed cannot be reached */
    }
    busy = false;
  }
  async function tick() {
    clearTimeout(timer);
    if (!document.hidden) {
      await pullFeed();
      if (!answered) { answered = true; if (!fresh()) render(); }
      if (wasFresh && !fresh()) render();           /* the newest edition has aged past a day and a half */
      wasFresh = fresh();
    }
    timer = setTimeout(tick, wait);
  }

  /* ───────── boot ───────── */
  window.addEventListener("resize", function () { paint(false); });
  if (window.ResizeObserver) new ResizeObserver(function () { if (!drag) paint(false); }).observe(viewport);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { paint(false); });
  setInterval(tickLabels, 1000);
  (function boot() {
    if (preview) { document.addEventListener("submit", function (ev) { ev.preventDefault(); }); setEditions(window.__BT_PREVIEW_FEED__); return; }
    var seeded = false;
    try {
      var rows = JSON.parse(sessionStorage.getItem(CACHE_KEY) || "null");
      if (Array.isArray(rows) && rows.length && !isStale(toDocs(rows))) {
        rows.forEach(function (r) { have[r.edition_id] = r; });
        shown = sigOf(rows); setEditions(toDocs(rows)); seeded = true;
      }
    } catch (e) {}
    if (!seeded && Array.isArray(window.__BT_SNAPSHOT__) && window.__BT_SNAPSHOT__.length && !isStale(window.__BT_SNAPSHOT__)) { setEditions(window.__BT_SNAPSHOT__); seeded = true; }
    if (!seeded) render();
    wasFresh = fresh();
    tick();
    document.addEventListener("visibilitychange", function () { if (!document.hidden && Date.now() - last > 30000) tick(); });
  })();
  announce();
  if (location.hash.indexOf("#read-") === 0) { var hid = location.hash.slice(6); if (indexOfId(hid) >= 0) openQR(hid); else try { history.replaceState({}, "", location.pathname + location.search); } catch (e) {} }
  else if (location.hash === "#join") show(N - 1, false);
  else if (location.hash === "#about") show(N - 2, false);
})();
</script>
<script src="/crm-track.js" defer></script>
</body>
</html>
